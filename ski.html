<body><main id="ski">
<div id="ski-game"></div>
<header><div><small id="skier-label">민지 / SKI</small><strong id="distance">0 m</strong><span id="run-time">00:00.00</span></div><div class="speed"><strong id="speed">0</strong><small>km/h</small></div><button id="restart" aria-label="출발점으로 다시 시작">↻</button></header>
<div id="boost-status" hidden><b id="boost-label">BOOST</b><div><i id="boost-fill"></i></div></div>

<div id="steering"><span>−90°</span><div><i></i></div><span>+90°</span></div>
<div id="welcome" class="overlay"><small>FRESH TRACKS / 01</small><h1>MINJI<br><em>SKI</em></h1><p>10,000m 설원, 나만의 최고 기록.</p><div id="ski-characters" role="group" aria-label="캐릭터 선택"><button data-character="minji" aria-pressed="true"><img src="./ski-minji-portrait-v2.png" alt=""><b>민지</b></button><button data-character="cherry" aria-pressed="false"><img src="./ski-cherry-portrait-v2.png" alt=""><b>체리</b></button><button data-character="ppojjak" aria-pressed="false"><img src="./ski-ppojjak-portrait-v2.png" alt=""><b>뽀짝</b></button></div><button id="ski-start">슬로프 시작 ↓</button><a class="rank-link" href="./ski-ranking.html">공유 랭킹 TOP 100 →</a><span id="race-status" role="status"></span><p class="help">화면을 누른 지점에서 좌우로 드래그<br>날개 부츠를 먹으면 3초간 부스터!<br>손을 떼면 직진 · PC는 ← →</p></div>
